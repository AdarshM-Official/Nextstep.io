{% block content %}

<style>
    body {
        background: #f5f6fa;
        font-family: "Inter", sans-serif;
    }

    .booking-wrapper {
        max-width: 1100px;
        margin: 50px auto;
        padding: 10px;
    }

    .row-flex {
        display: flex;
        gap: 30px;
        flex-wrap: wrap;
    }

    /* Left Card: Booking Form */
    .booking-card {
        flex: 1;
        min-width: 330px;
        background: #ffffff;
        border-radius: 14px;
        padding: 35px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        border: 1px solid #e6e6e6;
        animation: fadeIn .4s ease;
    }

    .booking-title {
        font-size: 1.7rem;
        font-weight: 600;
        margin-bottom: 25px;
        color: #333;
    }

    label {
        font-weight: 600;
        color: #444;
        margin-bottom: 6px;
        display: block;
    }

    .form-control {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #d1d1d1;
        background: #fff;
        color: #333;
        font-size: 15px;
    }

    .form-control:focus {
        border-color: #4d79ff;
        outline: none;
        box-shadow: 0 0 0 3px rgba(77,121,255,0.15);
    }

    textarea.form-control {
        resize: none;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background: #4d79ff;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        transition: .2s ease;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn-submit:hover {
        background: #3d63d9;
    }

    /* Right Card: Mentor Profile */
    .mentor-card {
        width: 300px;
        background: #ffffff;
        border-radius: 14px;
        padding: 25px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        border: 1px solid #e6e6e6;
        height: fit-content;
        animation: fadeIn .5s ease;
    }

    .mentor-photo {
        width: 100%;
        height: 200px;
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 15px;
    }

    .mentor-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .mentor-name {
        font-size: 1.2rem;
        font-weight: 600;
        color: #333;
    }

    .mentor-profession {
        font-size: 0.95rem;
        color: #666;
        margin-bottom: 10px;
    }

    .mentor-meta p {
        margin: 4px 0;
        font-size: 0.95rem;
        color: #555;
    }

    @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
    }
</style>


<div class="booking-wrapper">

    <div class="row-flex">

        <!-- LEFT: Appointment Form -->
        <div class="booking-card">
            <h3 class="booking-title">Book Appointment</h3>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Date</label>
                    <input type="date" name="date" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Time</label>
                    <input type="time" name="time" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Note (optional)</label>
                    <textarea name="note" class="form-control" rows="3"></textarea>
                </div>

                <button class="btn-submit">Confirm Booking</button>
            </form>
        </div>

        <!-- RIGHT: Mentor Card -->
        <div class="mentor-card">

            <div class="mentor-photo">
                {% if mentor.profile_photo %}
                <img src="{{ mentor.profile_photo.url }}" alt="Mentor">
                {% endif %}
            </div>

            <h4 class="mentor-name">{{ mentor.username }}</h4>
            <p class="mentor-profession">{{ mentor.profession }}</p>

            <div class="mentor-meta">
                <p><strong>Expertise:</strong> {{ mentor.expertise }}</p>
                <p><strong>Experience:</strong> {{ mentor.experience_years }} years</p>
            </div>

        </div>

    </div>

</div>

{% endblock %}
